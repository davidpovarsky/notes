<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>אפליקציית הערות + ספריא</title>

  <!-- CSS נפרד -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app" class="mode-tabs">
  <div class="top-bar">
    <div class="top-bar-right">
      <button id="textViewBtn" class="btn tab active" data-view="text">📜 טקסט</button>
      <button id="noteViewBtn" class="btn tab" data-view="note">✏️ כתיבת הערה</button>
      <button id="listViewBtn" class="btn tab" data-view="list">📚 הערות</button>
    </div>
    <div class="top-bar-left">
      <span id="connectionStatus" class="status">מתחבר...</span>
      <button id="modeToggleBtn" class="btn small secondary">
        <span class="mode-label">מצב: כרטיסיות</span> ↔️
      </button>
    </div>
  </div>

  <div class="content">
    <div id="textPanel" class="panel active">
      <!-- אזור טקסט יתווסף בהמשך -->
    </div>

    <div id="rightPanel" class="panel">
      <div id="rightPanel-inner">
        <div id="noteFormPanel" class="panel active" style="height:auto; box-shadow:none; border-radius:0; padding:0; border:none;">
          <form id="noteForm" style="display:flex;flex-direction:column;height:100%;">
            <div class="form-inline">
              <div class="form-group" style="max-width:120px;">
                <label for="owner">מזהה משתמש</label>
                <input type="number" id="owner" value="199238" />
              </div>
              <div class="form-group">
                <label for="noteType">סוג הערה</label>
                <select id="noteType">
                  <option value="verse">על מקור (score)</option>
                  <option value="word">על מילה</option>
                  <option value="topic">על נושא</option>
                </select>
              </div>
            </div>

            <div class="checkbox-row">
              <input type="checkbox" id="isPublic" checked />
              <label for="isPublic">הערה ציבורית</label>
            </div>

            <div id="refGroup" class="form-group">
              <label for="ref">מקור (ref)</label>
              <input type="text" id="ref" />
            </div>

            <div id="wordGroup" class="form-group" style="display:none;">
              <label for="word">מילה</label>
              <input type="text" id="word" />
            </div>

            <div id="topicGroup" class="form-group" style="display:none;">
              <label for="topic">נושא</label>
              <input type="text" id="topic" />
            </div>

            <div class="form-group">
              <label for="noteContent">טקסט ההערה</label>
              <textarea id="noteContent"></textarea>
            </div>

            <div class="note-buttons-row">
              <button type="submit" id="saveBtn" class="btn">💾 שמור הערה</button>
              <button type="button" id="clearBtn" class="btn secondary">🧹 נקה טופס</button>
              <button type="button" id="loadAllBtn" class="btn secondary">🔄 טען את כל ההערות</button>
            </div>

            <div class="note-buttons-row">
              <button type="button" class="btn small secondary" onclick="addScoreTargetFromForm()">➕ יעד מקור (score)</button>
              <button type="button" class="btn small secondary" onclick="addWordTargetFromForm()">➕ יעד מילה</button>
              <button type="button" class="btn small secondary" onclick="addTopicTargetFromForm()">➕ יעד נושא</button>
            </div>

            <div id="targetsInfo" class="targets-info">
              עדיין לא נבחרו יעדים נוספים. ברירת מחדל: לפי סוג ההערה.
            </div>
          </form>
        </div>

        <div id="notesListPanel" class="panel" style="height:auto; box-shadow:none; border-radius:0; padding:0; border:none;">
          <div class="stats-row">
            <span>סה"כ הערות: <strong id="totalNotes">0</strong></span>
            <span>על מקורות: <strong id="scoreNotes">0</strong></span>
            <span>על נושאים: <strong id="topicNotes">0</strong></span>
            <span>על מילים: <strong id="wordNotes">0</strong></span>
          </div>

          <div class="category-tabs">
            <button class="btn small tab category-tab active" data-category="all">הכל</button>
            <button class="btn small tab category-tab" data-category="score">מקורות</button>
            <button class="btn small tab category-tab" data-category="topic">נושאים</button>
            <button class="btn small tab category-tab" data-category="word">מילים</button>
          </div>

          <div class="notes-list-scroll">
            <div id="allNotes" class="notes-category active"></div>
            <div id="scoreNotesContainer" class="notes-category" style="display:none;"></div>
            <div id="topicNotesContainer" class="notes-category" style="display:none;"></div>
            <div id="wordNotesContainer" class="notes-category" style="display:none;"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- JS נפרד -->
<script src="js/app.js"></script>
</body>
</html>
